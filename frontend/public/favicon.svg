<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Dark navy background -->
  <rect width="48" height="48" rx="12" fill="#080D18"/>
  <!-- Subtle border ring -->
  <rect width="47" height="47" x="0.5" y="0.5" rx="11.5" stroke="rgba(100,150,255,0.18)" stroke-width="1" fill="none"/>
  <!-- Brand emerald glow arc (partial circle - signature element) -->
  <circle cx="24" cy="24" r="16"
    fill="none"
    stroke="rgba(16,185,129,0.15)"
    stroke-width="1.5"/>
  <path d="M24 8 A16 16 0 1 1 8 24"
    fill="none"
    stroke="#10B981"
    stroke-width="2.5"
    stroke-linecap="round"/>
  <!-- DC monogram -->
  <text x="24" y="28.5"
    text-anchor="middle"
    fill="#E8EEF8"
    font-family="Inter,system-ui,sans-serif"
    font-weight="800"
    font-size="11"
    letter-spacing="-0.5">DC</text>
</svg>
