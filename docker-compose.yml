version: "3.9"

services:
  backend:
    build: ./backend
    container_name: darkcred-backend
    restart: always
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - .:/app/project
      - /var/run/docker.sock:/var/run/docker.sock
    env_file: .env
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: darkcred-frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
